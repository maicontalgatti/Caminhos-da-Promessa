# Testes automatizados com o Godot oficial. Roda o código do pull request sem segredos e com
# permissão somente de leitura; nunca troque o gatilho por pull_request_target.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar e conferir o Godot oficial
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/$zip"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/$zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/godot"
          bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$bin"
          echo "GODOT=$bin" >> "$GITHUB_ENV"

      - name: Importar o projeto
        run: |
          # O primeiro import de um clone novo acusa recursos do tema ainda não importados.
          timeout 600 "$GODOT" --headless --path . --import || true
          timeout 600 "$GODOT" --headless --path . --import

      - name: Suíte de testes
        run: timeout 900 "$GODOT" --headless --path . res://tests/test_runner.tscn

      - name: Fluxo pelos menus
        run: timeout 600 "$GODOT" --headless --path . --script res://tests/flow_smoke.gd

      - name: Validação de conteúdo
        run: timeout 300 "$GODOT" --headless --path . --script res://tools/validate_content.gd

      - name: Fábrica de missões
        run: timeout 300 "$GODOT" --headless --path . --script res://tools/factory.gd -- check

      - name: Auditoria de áudio
        run: timeout 300 "$GODOT" --headless --path . --script res://tools/audio/audit_audio.gd
